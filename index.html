<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スマート家計簿 - Kakeibo App</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    /* カスタムスクロールバー */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

  <!-- ヘッダー -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold text-xl shadow-md shadow-indigo-100">
          <i class="fa-solid fa-wallet"></i>
        </div>
        <span class="font-bold text-xl text-slate-800 tracking-tight">スマート家計簿</span>
      </div>

      <!-- ユーザープロフィール / ログアウト -->
      <div id="user-info" class="hidden flex items-center space-x-3">
        <img id="user-avatar" src="" alt="Avatar" class="w-9 h-9 rounded-full border border-slate-200">
        <span id="user-name" class="font-medium text-sm text-slate-700 hidden sm:inline"></span>
        <button id="btn-logout" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium py-2 px-3 rounded-lg transition duration-200 flex items-center space-x-1">
          <i class="fa-solid fa-right-from-bracket"></i>
          <span class="hidden sm:inline">ログアウト</span>
        </button>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="max-w-6xl mx-auto px-4 py-6 w-full flex-grow">

    <!-- 1. 未ログイン状態の画面 -->
    <section id="login-section" class="py-12 flex flex-col items-center justify-center text-center">
      <div class="bg-white p-8 sm:p-12 rounded-3xl shadow-xl max-w-md w-full border border-slate-100">
        <div class="w-20 h-20 bg-indigo-50 text-indigo-600 rounded-3xl flex items-center justify-center mx-auto mb-6 text-3xl">
          <i class="fa-solid fa-chart-pie"></i>
        </div>
        <h1 class="text-2xl font-bold text-slate-800 mb-2">シンプル＆スマートな収支管理</h1>
        <p class="text-slate-500 text-sm mb-8 leading-relaxed">
          Googleアカウントでサインインして、毎月の収入と支出を簡単に記録・分析しましょう。
        </p>
        <button id="btn-google-login" class="w-full bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-semibold py-3 px-4 rounded-xl shadow-sm transition duration-200 flex items-center justify-center space-x-3">
          <svg class="w-5 h-5" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span>Googleアカウントでログイン</span>
        </button>
      </div>
    </section>

    <!-- 2. ログイン後のメインダッシュボード -->
    <section id="dashboard-section" class="hidden space-y-6">

      <!-- 年月セレクター＆サマリーカード -->
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200/80 space-y-4">
        <!-- 年月切り替え -->
        <div class="flex items-center justify-between border-b border-slate-100 pb-4">
          <div class="flex items-center space-x-2">
            <button id="btn-prev-month" class="w-9 h-9 rounded-xl hover:bg-slate-100 text-slate-600 flex items-center justify-center transition">
              <i class="fa-solid fa-chevron-left"></i>
            </button>
            <h2 id="current-month-text" class="text-lg font-bold text-slate-800">2026年 10月</h2>
            <button id="btn-next-month" class="w-9 h-9 rounded-xl hover:bg-slate-100 text-slate-600 flex items-center justify-center transition">
              <i class="fa-solid fa-chevron-right"></i>
            </button>
          </div>
          <button id="btn-today" class="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-600 font-semibold px-3 py-1.5 rounded-lg transition">
            今月を表示
          </button>
        </div>

        <!-- サマリー数値 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="bg-emerald-50/60 border border-emerald-100 p-4 rounded-xl">
            <div class="text-xs font-medium text-emerald-600 mb-1 flex items-center">
              <i class="fa-solid fa-arrow-down-left mr-1.5"></i> 収入合計
            </div>
            <div id="total-income" class="text-2xl font-extrabold text-emerald-700">¥0</div>
          </div>
          <div class="bg-rose-50/60 border border-rose-100 p-4 rounded-xl">
            <div class="text-xs font-medium text-rose-600 mb-1 flex items-center">
              <i class="fa-solid fa-arrow-up-right mr-1.5"></i> 支出合計
            </div>
            <div id="total-expense" class="text-2xl font-extrabold text-rose-700">¥0</div>
          </div>
          <div class="bg-slate-50 border border-slate-200/80 p-4 rounded-xl">
            <div class="text-xs font-medium text-slate-500 mb-1 flex items-center">
              <i class="fa-solid fa-scale-balanced mr-1.5"></i> 収支差額
            </div>
            <div id="total-balance" class="text-2xl font-extrabold text-slate-800">¥0</div>
          </div>
        </div>
      </div>

      <!-- メインエリア（フォーム＆グラフ ＋ 明細一覧） -->
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- 左側: 入力フォーム ＆ 円グラフ (lg:col-span-5) -->
        <div class="lg:col-span-5 space-y-6">
          
          <!-- 入力フォーム -->
          <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200/80">
            <h3 class="font-bold text-slate-800 text-base mb-4 flex items-center">
              <i class="fa-solid fa-pen-to-square text-indigo-600 mr-2"></i> 収支を記録
            </h3>

            <form id="transaction-form" class="space-y-4">
              <!-- 種別（収入/支出） -->
              <div class="grid grid-cols-2 gap-2 p-1 bg-slate-100 rounded-xl">
                <button type="button" id="type-expense" class="py-2 text-xs font-bold rounded-lg transition bg-white text-rose-600 shadow-sm">支出</button>
                <button type="button" id="type-income" class="py-2 text-xs font-bold rounded-lg transition text-slate-500 hover:text-slate-700">収入</button>
              </div>

              <!-- 日付 -->
              <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">日付</label>
                <input type="date" id="input-date" required class="w-full text-sm border border-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
              </div>

              <!-- カテゴリ -->
              <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">カテゴリ</label>
                <select id="input-category" required class="w-full text-sm border border-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                  <!-- JSで動的に変更 -->
                </select>
              </div>

              <!-- 金額 -->
              <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">金額 (円)</label>
                <input type="number" id="input-amount" min="1" placeholder="例: 1200" required class="w-full text-sm border border-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
              </div>

              <!-- メモ -->
              <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">メモ (任意)</label>
                <input type="text" id="input-memo" placeholder="例: スーパーで買い出し" class="w-full text-sm border border-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
              </div>

              <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl transition shadow-md shadow-indigo-100 text-sm">
                保存する
              </button>
            </form>
          </div>

          <!-- 支出カテゴリ内訳グラフ -->
          <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200/80">
            <h3 class="font-bold text-slate-800 text-base mb-4 flex items-center">
              <i class="fa-solid fa-chart-pie text-indigo-600 mr-2"></i> 支出カテゴリ内訳
            </h3>
            <div class="relative w-full h-56 flex items-center justify-center">
              <canvas id="expense-chart"></canvas>
              <div id="no-chart-data" class="absolute inset-0 flex items-center justify-center text-xs text-slate-400">
                今月の支出データはありません
              </div>
            </div>
          </div>

        </div>

        <!-- 右側: 明細履歴リスト (lg:col-span-7) -->
        <div class="lg:col-span-7">
          <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200/80 min-h-[400px]">
            <div class="flex items-center justify-between mb-4">
              <h3 class="font-bold text-slate-800 text-base flex items-center">
                <i class="fa-solid fa-list-ul text-indigo-600 mr-2"></i> 履歴一覧
              </h3>
              <span id="transaction-count" class="text-xs bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full font-medium">0件</span>
            </div>

            <!-- リスト表示エリア -->
            <div id="transaction-list" class="space-y-3">
              <!-- JSでアイテム挿入 -->
            </div>

            <!-- データなし時の表示 -->
            <div id="empty-state" class="hidden py-16 text-center">
              <i class="fa-solid fa-receipt text-slate-300 text-4xl mb-3"></i>
              <p class="text-slate-500 text-sm">該当する期間のデータがありません。</p>
            </div>
          </div>
        </div>

      </div>

    </section>

  </main>

  <!-- フッター -->
  <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-400">
    &copy; 2026 Kakeibo App. Powered by Firebase & GitHub Pages.
  </footer>

  <!-- カスタム通知トースト -->
  <div id="toast" class="fixed bottom-5 right-5 bg-slate-800 text-white text-xs px-4 py-3 rounded-xl shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center space-x-2">
    <i class="fa-solid fa-circle-check text-emerald-400 text-base" id="toast-icon"></i>
    <span id="toast-message">メッセージ</span>
  </div>

  <!-- 削除確認ダイアログモーダル -->
  <div id="delete-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-200">
    <div class="bg-white rounded-2xl p-6 max-w-sm w-full mx-4 shadow-xl">
      <h3 class="font-bold text-slate-800 text-base mb-2">データを削除しますか？</h3>
      <p class="text-xs text-slate-500 mb-6">この操作は取り消せません。</p>
      <div class="flex justify-end space-x-2">
        <button id="modal-cancel-btn" class="px-4 py-2 text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl transition">キャンセル</button>
        <button id="modal-confirm-btn" class="px-4 py-2 text-xs font-semibold text-white bg-rose-600 hover:bg-rose-700 rounded-xl transition">削除する</button>
      </div>
    </div>
  </div>

  <!-- Firebase Scripts (v11 ES Modules) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // ユーザー設定のFirebase構成
    const firebaseConfig = {
      apiKey: "AIzaSyBhRFX86N3Hs4sMft3nOGvrOXtLNlPbyUA",
      authDomain: "kakeibo-c0b0c.firebaseapp.com",
      projectId: "kakeibo-c0b0c",
      storageBucket: "kakeibo-c0b0c.firebasestorage.app",
      messagingSenderId: "384924865817",
      appId: "1:384924865817:web:9cbaffb50103670680a188"
    };

    // Firebase 初期化
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();

    // 状態管理
    let currentUser = null;
    let transactions = [];
    let currentType = 'expense'; // 'expense' or 'income'
    let selectedDate = new Date(); // 表示選択中の月
    let chartInstance = null;
    let pendingDeleteId = null;

    // カテゴリ定義
    const CATEGORIES = {
      expense: ['食費', '日用品', '交通費', '娯楽・趣味', '住居費', '水道光熱費', '通信費', '医療・健康', 'その他支出'],
      income: ['給与', '賞与', '副業', '臨時収入', 'その他収入']
    };

    // HTML要素定義
    const loginSection = document.getElementById('login-section');
    const dashboardSection = document.getElementById('dashboard-section');
    const userInfo = document.getElementById('user-info');
    const userAvatar = document.getElementById('user-avatar');
    const userName = document.getElementById('user-name');
    const btnGoogleLogin = document.getElementById('btn-google-login');
    const btnLogout = document.getElementById('btn-logout');

    const btnPrevMonth = document.getElementById('btn-prev-month');
    const btnNextMonth = document.getElementById('btn-next-month');
    const btnToday = document.getElementById('btn-today');
    const currentMonthText = document.getElementById('current-month-text');

    const totalIncomeEl = document.getElementById('total-income');
    const totalExpenseEl = document.getElementById('total-expense');
    const totalBalanceEl = document.getElementById('total-balance');

    const typeExpenseBtn = document.getElementById('type-expense');
    const typeIncomeBtn = document.getElementById('type-income');
    const transactionForm = document.getElementById('transaction-form');
    const inputDate = document.getElementById('input-date');
    const inputCategory = document.getElementById('input-category');
    const inputAmount = document.getElementById('input-amount');
    const inputMemo = document.getElementById('input-memo');

    const transactionList = document.getElementById('transaction-list');
    const transactionCount = document.getElementById('transaction-count');
    const emptyState = document.getElementById('empty-state');

    const deleteModal = document.getElementById('delete-modal');
    const modalCancelBtn = document.getElementById('modal-cancel-btn');
    const modalConfirmBtn = document.getElementById('modal-confirm-btn');

    // 本日の日付セット
    const getFormattedDate = (date) => date.toISOString().split('T')[0];
    inputDate.value = getFormattedDate(new Date());

    // 認証監視
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        userAvatar.src = user.photoURL || 'https://via.placeholder.com/40';
        userName.textContent = user.displayName || 'ユーザー';
        userInfo.classList.remove('hidden');
        loginSection.classList.add('hidden');
        dashboardSection.classList.remove('hidden');

        // データ購読開始
        subscribeTransactions();
      } else {
        currentUser = null;
        userInfo.classList.add('hidden');
        loginSection.classList.remove('hidden');
        dashboardSection.classList.add('hidden');
        transactions = [];
      }
    });

    // ログイン・ログアウト処理
    btnGoogleLogin.addEventListener('click', async () => {
      try {
        await signInWithPopup(auth, googleProvider);
        showToast('ログインしました');
      } catch (error) {
        console.error("Login Error:", error);
        showToast('ログインに失敗しました', true);
      }
    });

    btnLogout.addEventListener('click', async () => {
      try {
        await signOut(auth);
        showToast('ログアウトしました');
      } catch (error) {
        console.error("Logout Error:", error);
      }
    });

    // Firestoreデータ購読
    let unsubscribe = null;
    function subscribeTransactions() {
      if (!currentUser) return;
      if (unsubscribe) unsubscribe();

      const userColRef = collection(db, 'users', currentUser.uid, 'transactions');
      
      unsubscribe = onSnapshot(userColRef, (snapshot) => {
        transactions = snapshot.docs.map(doc => ({
          id: doc.id,
          ...doc.data()
        }));
        updateUI();
      }, (error) => {
        console.error("Firestore Error:", error);
        showToast('データの取得に失敗しました', true);
      });
    }

    // 収支タイプ切り替え (支出 / 収入)
    function setType(type) {
      currentType = type;
      if (type === 'expense') {
        typeExpenseBtn.className = "py-2 text-xs font-bold rounded-lg transition bg-white text-rose-600 shadow-sm";
        typeIncomeBtn.className = "py-2 text-xs font-bold rounded-lg transition text-slate-500 hover:text-slate-700";
      } else {
        typeIncomeBtn.className = "py-2 text-xs font-bold rounded-lg transition bg-white text-emerald-600 shadow-sm";
        typeExpenseBtn.className = "py-2 text-xs font-bold rounded-lg transition text-slate-500 hover:text-slate-700";
      }
      populateCategories();
    }

    typeExpenseBtn.addEventListener('click', () => setType('expense'));
    typeIncomeBtn.addEventListener('click', () => setType('income'));

    function populateCategories() {
      inputCategory.innerHTML = '';
      CATEGORIES[currentType].forEach(cat => {
        const option = document.createElement('option');
        option.value = cat;
        option.textContent = cat;
        inputCategory.appendChild(option);
      });
    }
    populateCategories();

    // トランザクション追加
    transactionForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentUser) return;

      const amount = parseInt(inputAmount.value, 10);
      if (isNaN(amount) || amount <= 0) {
        showToast('有効な金額を入力してください', true);
        return;
      }

      const newTransaction = {
        type: currentType,
        date: inputDate.value,
        category: inputCategory.value,
        amount: amount,
        memo: inputMemo.value.trim(),
        createdAt: new Date().toISOString()
      };

      try {
        await addDoc(collection(db, 'users', currentUser.uid, 'transactions'), newTransaction);
        inputAmount.value = '';
        inputMemo.value = '';
        showToast('記録を保存しました');
      } catch (error) {
        console.error("Add Error:", error);
        showToast('保存に失敗しました', true);
      }
    });

    // 年月切り替え制御
    function updateMonthDisplay() {
      const year = selectedDate.getFullYear();
      const month = selectedDate.getMonth() + 1;
      currentMonthText.textContent = `${year}年 ${month}月`;
      updateUI();
    }

    btnPrevMonth.addEventListener('click', () => {
      selectedDate.setMonth(selectedDate.getMonth() - 1);
      updateMonthDisplay();
    });

    btnNextMonth.addEventListener('click', () => {
      selectedDate.setMonth(selectedDate.getMonth() + 1);
      updateMonthDisplay();
    });

    btnToday.addEventListener('click', () => {
      selectedDate = new Date();
      updateMonthDisplay();
    });

    // メインUI更新
    function updateUI() {
      const targetYearMonth = `${selectedDate.getFullYear()}-${String(selectedDate.getMonth() + 1).padStart(2, '0')}`;

      // 当月のデータフィルター
      const monthlyData = transactions.filter(t => t.date && t.date.startsWith(targetYearMonth));

      // 日付の降順ソート
      monthlyData.sort((a, b) => new Date(b.date) - new Date(a.date));

      // 集計
      let income = 0;
      let expense = 0;
      const categoryTotals = {};

      monthlyData.forEach(t => {
        if (t.type === 'income') {
          income += t.amount;
        } else {
          expense += t.amount;
          categoryTotals[t.category] = (categoryTotals[t.category] || 0) + t.amount;
        }
      });

      // サマリー更新
      totalIncomeEl.textContent = `¥${income.toLocaleString()}`;
      totalExpenseEl.textContent = `¥${expense.toLocaleString()}`;
      const balance = income - expense;
      totalBalanceEl.textContent = `¥${balance.toLocaleString()}`;
      totalBalanceEl.className = `text-2xl font-extrabold ${balance >= 0 ? 'text-slate-800' : 'text-rose-600'}`;

      // リスト描画
      renderList(monthlyData);

      // グラフ描画
      renderChart(categoryTotals);
    }

    // リストレンダリング
    function renderList(items) {
      transactionList.innerHTML = '';
      transactionCount.textContent = `${items.length}件`;

      if (items.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');

      items.forEach(item => {
        const isExpense = item.type === 'expense';
        const card = document.createElement('div');
        card.className = "flex items-center justify-between p-3.5 bg-slate-50 hover:bg-slate-100/80 rounded-xl transition border border-slate-200/60";

        card.innerHTML = `
          <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl ${isExpense ? 'bg-rose-100 text-rose-600' : 'bg-emerald-100 text-emerald-600'} flex items-center justify-center text-sm font-bold">
              <i class="fa-solid ${isExpense ? 'fa-minus' : 'fa-plus'}"></i>
            </div>
            <div>
              <div class="flex items-center space-x-2">
                <span class="font-bold text-slate-800 text-sm">${escapeHtml(item.category)}</span>
                <span class="text-[10px] text-slate-400 font-medium">${item.date}</span>
              </div>
              ${item.memo ? `<p class="text-xs text-slate-500 mt-0.5">${escapeHtml(item.memo)}</p>` : ''}
            </div>
          </div>
          <div class="flex items-center space-x-3">
            <span class="font-extrabold text-sm ${isExpense ? 'text-rose-600' : 'text-emerald-600'}">
              ${isExpense ? '-' : '+'}¥${item.amount.toLocaleString()}
            </span>
            <button class="btn-delete text-slate-300 hover:text-rose-500 transition p-1.5 rounded-lg" data-id="${item.id}">
              <i class="fa-solid fa-trash-can text-sm"></i>
            </button>
          </div>
        `;

        // 削除イベント
        card.querySelector('.btn-delete').addEventListener('click', () => {
          pendingDeleteId = item.id;
          openDeleteModal();
        });

        transactionList.appendChild(card);
      });
    }

    // Chart.js グラフレンダリング
    function renderChart(categoryTotals) {
      const ctx = document.getElementById('expense-chart').getContext('2d');
      const noDataEl = document.getElementById('no-chart-data');

      const labels = Object.keys(categoryTotals);
      const data = Object.values(categoryTotals);

      if (labels.length === 0) {
        noDataEl.classList.remove('hidden');
        if (chartInstance) {
          chartInstance.destroy();
          chartInstance = null;
        }
        return;
      }

      noDataEl.classList.add('hidden');

      const colors = [
        '#f43f5e', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6',
        '#ec4899', '#14b8a6', '#6366f1', '#64748b'
      ];

      if (chartInstance) {
        chartInstance.destroy();
      }

      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels,
          datasets: [{
            data: data,
            backgroundColor: colors.slice(0, labels.length),
            borderWidth: 2,
            borderColor: '#ffffff'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'bottom',
              labels: {
                boxWidth: 12,
                font: { size: 11 }
              }
            }
          },
          cutout: '70%'
        }
      });
    }

    // 削除確認モーダル操作
    function openDeleteModal() {
      deleteModal.classList.remove('hidden');
      setTimeout(() => deleteModal.classList.remove('opacity-0'), 10);
    }

    function closeDeleteModal() {
      deleteModal.classList.add('opacity-0');
      setTimeout(() => {
        deleteModal.classList.add('hidden');
        pendingDeleteId = null;
      }, 200);
    }

    modalCancelBtn.addEventListener('click', closeDeleteModal);

    modalConfirmBtn.addEventListener('click', async () => {
      if (!pendingDeleteId || !currentUser) return;
      try {
        await deleteDoc(doc(db, 'users', currentUser.uid, 'transactions', pendingDeleteId));
        showToast('データを削除しました');
      } catch (error) {
        console.error("Delete Error:", error);
        showToast('削除に失敗しました', true);
      } finally {
        closeDeleteModal();
      }
    });

    // ユーティリティ: XSS対策
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, (m) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      })[m]);
    }

    // ユーティリティ: トースト表示
    function showToast(message, isError = false) {
      const toast = document.getElementById('toast');
      const toastMessage = document.getElementById('toast-message');
      const toastIcon = document.getElementById('toast-icon');

      toastMessage.textContent = message;
      if (isError) {
        toastIcon.className = 'fa-solid fa-circle-exclamation text-rose-400 text-base';
      } else {
        toastIcon.className = 'fa-solid fa-circle-check text-emerald-400 text-base';
      }

      toast.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 3000);
    }

  </script>
</body>
</html>
